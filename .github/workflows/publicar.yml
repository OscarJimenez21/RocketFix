# Publica la tienda en GitHub Pages cada vez que se suben cambios a main (como antes: Push origin = página actualizada).
# También se puede iniciar a mano en GitHub → Actions → "Publicar la tienda" → Run workflow.
# Antes de compilar revisa el código (lint), corre las pruebas automáticas y comprueba el catálogo:
# si algo de eso falla, no publica y la página sigue como estaba.
# Las acciones de GitHub van fijadas por su código exacto (SHA), no por la etiqueta v4: una etiqueta se puede mover a
# otro código sin aviso; el SHA no. Al lado va la versión, para saber cuál es.
name: Publicar la tienda

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # deploy-pages (desde la v4) pide poder leer el estado de la publicación
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historial completo: el mapa del sitio usa la fecha del último cambio de los datos de cada página
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 LTS (soporte hasta abril de 2028), el mismo que se usa en el computador (.herramientas)
          node-version: 24
          cache: npm
      - run: npm ci
      # Avisos de seguridad de las herramientas: se muestran, pero no frenan la publicación de precios
      - run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run probar
      - run: npm run verificar
      - run: npm run build
        env:
          BASE_PATH: /
          SITIO_URL: https://rocketfix.com.co
          # Archivo de productos para Google Merchant Center (Google Shopping): https://rocketfix.com.co/feed-google.xml
          FEED_GOOGLE: "1"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Desde la v4 deja por fuera los archivos que empiezan con punto; la tienda no tiene ninguno en public/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
