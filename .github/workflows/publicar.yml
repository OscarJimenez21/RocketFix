# Publica la tienda en GitHub Pages cada vez que se suben cambios a main (como antes: Push origin = página actualizada).
# También se puede iniciar a mano en GitHub → Actions → "Publicar la tienda" → Run workflow.
# Antes de compilar comprueba que el catálogo sea el mismo de la tienda original; si no coincide, no publica.
name: Publicar la tienda

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verificar
      - run: npm run build
        env:
          BASE_PATH: /RocketFix/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
